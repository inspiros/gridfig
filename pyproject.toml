[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridfig"
version = "0.1.0"
description = "A local image-grid editor and Typst helper for paper figures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
images = ["Pillow>=10"]

[project.scripts]
gridfig = "gridfig:main"

[tool.setuptools]
py-modules = ["gridfig"]
packages = ["gridfig_assets"]
